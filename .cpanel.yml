---
deployment:
  tasks:
    - export REPOPATH=/home/$USER/repositories/thumbpin-main
    - export DEPLOYPATH=/home/$USER/public_html/

    # Sync public assets into the document root. The excludes are paths that
    # exist only on the server (uploads, the storage symlink), which --delete
    # would otherwise wipe on every deploy.
    - /usr/bin/rsync -a --delete --exclude='storage' --exclude='uploads' --exclude='.well-known' --exclude='cgi-bin' $REPOPATH/public/ $DEPLOYPATH

    # The application is served straight out of this checkout, so views and
    # routes are already current -- only the caches need clearing.
    - cd $REPOPATH && /usr/local/bin/php artisan view:clear
    - cd $REPOPATH && /usr/local/bin/php artisan config:clear
    - cd $REPOPATH && /usr/local/bin/php artisan route:clear
